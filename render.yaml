# Render Blueprint for the Prime Care API (Render dashboard → New → Blueprint → pick this repo).
# MONGODB_URI is asked for during setup: paste the MongoDB Atlas connection string.
services:
  - type: web
    name: prime-care-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: primecare
      - key: JWT_SECRET
        generateValue: true
      - key: HOSPITAL_TZ
        value: Asia/Kolkata
